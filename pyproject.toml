[project]
name = "polder"
version = "0.0.1"
description = "Arrays with DataFrame axis labels"
readme = "README.md"
authors = [{ name = "Nardi Lam", email = "mail@nardilam.nl" }]
requires-python = ">=3.11"
dependencies = [
    "immutabledict>=4.3.1",
    "narwhals>=2.18.1",
    "numpy>=2.4.4",
    "optype[numpy]>=0.17.0",
    "ordered-set>=4.1.0",
]

[build-system]
requires = ["uv_build>=0.11.2,<0.12"]
build-backend = "uv_build"

[dependency-groups]
dev = ["polars>=1.39.3", "pytest>=9.0.2"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
ignore = ["E731"]
