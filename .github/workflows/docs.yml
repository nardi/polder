name: Documentation

on:
  push:
    branches:
      - main
  # Allow running the workflow manually from the Actions tab.
  workflow_dispatch:

# Grant the token the permissions GitHub Pages deployment needs.
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, cancelling in-progress runs but letting
# any already-running deployment finish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # Install the project plus the lean "docs" group, which holds zensical and
      # the mkdocstrings handler used to build the API reference.
      - name: Install dependencies
        run: uv sync --no-default-groups --group docs

      # Strict mode aborts the build on warnings, so a broken cross-reference or
      # an mkdocstrings identifier that fails to resolve fails the workflow.
      - name: Build site
        run: uv run zensical build --clean --strict

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
